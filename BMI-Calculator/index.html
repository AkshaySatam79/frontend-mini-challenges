<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIM</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <nav class="navbar">
      <img src="aklogo.png" alt="logo">
      <h1>BMI Calculator
</h1>
<a href="https://github.com/AkshaySatam79" class="icon"><i class="fa-brands fa-github fa-flip-horizontal" style="color: #00040a;"></i></i></a>
    </nav>

    <section>
<p class="height-text">Height (cm):</p>
<input type="number" name="height" id="height" placeholder="Enter height" min="45">
<p class="weight-text">Weight (kg):</p>
<input type="number" name="weight" id="weight" placeholder="Enter weight" min="1">

    </section>
<button class="button">Calculate BMI</button>
    <h2>Your BMI:</h2>
    <span class="result"></span>
    <h2>BMI Categories</h2>
    <span class="categories"></span>
    <p class="error"></p>
  </main>
</body>
</html>
