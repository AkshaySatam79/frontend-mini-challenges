<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.webp">
  <title>Expense Tracker</title>

  <!-- Poppins Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">

    <div class="logo-circle"><img src="favicon.webp" alt=""></div>

    <h1>Expense Tracker</h1>

  </header>


  <main class="container">

    <!-- Balance Card -->
    <section class="balance-card">

      <p class="balance-title">Total Balance</p>

      <h2 class="total-amount">$0</h2>

      <div class="balance-row">

        <!-- Income -->
        <div class="balance-box income-box">

          <div class="balance-icon">
            <i class="fa-solid fa-arrow-down"></i>
          </div>

          <div>
            <span>Income</span>
            <strong class="total-income">$0</strong>
          </div>

        </div>


        <!-- Expenses -->
        <div class="balance-box expense-box">

          <div class="balance-icon">
            <i class="fa-solid fa-arrow-up"></i>
          </div>

          <div>
            <span>Expenses</span>
            <strong class="total-expense">$0</strong>
          </div>

        </div>

      </div>

    </section>
    <!-- Add New Entry -->
    <section class="entry-card">

      <h2>Add New Entry</h2>

      <form class="form">

        <!-- Description -->
        <div class="form-group">

          <label>Description</label>

          <input type="text" placeholder="e.g. Coffee with friends" class="description">

        </div>


        <!-- Amount -->
        <div class="form-group">

          <label>Amount ($)</label>

          <input type="number" placeholder="0.00" class="amount">

        </div>


        <!-- Category and Type -->
        <div class="form-row">

          <div class="form-group">

            <label>Category</label>

            <div class="select-box">

              <select class="category-select">
                <option>Food & Dining</option>
                <option>Salary</option>
                <option>Entertainment</option>
                <option>Shopping</option>
                <option>Healthcare</option>
                <option>Transport</option>
              </select>

              <i class="fa-solid fa-chevron-down"></i>

            </div>

          </div>


          <div class="form-group">

            <label>Type</label>

            <div class="select-box">

              <select class="type">
                <option>Expense</option>
                <option>Income</option>
              </select>

              <i class="fa-solid fa-chevron-down"></i>

            </div>

          </div>

        </div>


        <!-- Button -->
        <button class="add-btn">

          <i class="fa-solid fa-plus"></i>

          <span>Add Entry</span>

        </button>

      </form>

    </section>

    <!-- Recent Transactions -->
    <section class="transactions-section">

      <h2>Recent Transactions</h2>

      <div class="transaction-list">

      </div>
    </section>




  </main>

</body>

</html>
